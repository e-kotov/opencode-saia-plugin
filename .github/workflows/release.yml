name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check package version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Install OpenCode 2.1.4 for runtime checks
        env:
          OPENCODE_ARCHIVE_SHA256: 2edaf8cf96e81dec5ee996a3196b03345cf59e5a1673d83a4599bb4afc5c5f6d
        run: |
          curl --fail --location --retry 3 https://opencode.ai/files/bin/2.1.4/opencode-linux-x64-baseline.tar.gz --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "$OPENCODE_ARCHIVE_SHA256  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          "$RUNNER_TEMP/opencode-bin/opencode" --version
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: |
          bash -n src/generate-saia-config.sh
          bash -n src/copy-saia-config.sh
          bash -n src/validate-config.sh
          bash -n src/setup-wizard.sh

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run tsc

      - name: Validate bundled configuration
        run: npm run validate

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "SAIA Plugin $GITHUB_REF_NAME" --generate-notes
